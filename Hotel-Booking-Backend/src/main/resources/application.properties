
# ==============================
# Application Configuration
# ==============================

spring.application.name=Hotel-Booking-Backend


# ==============================
# PostgreSQL Database Configuration
# ==============================

spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_booking_db
spring.datasource.username=postgres
spring.datasource.password=Anbesivam@25
spring.datasource.driver-class-name=org.postgresql.Driver


# ==============================
# JPA / Hibernate Configuration
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ==============================
# Server Configuration
# ==============================

server.port=8080


# ==============================
# File Upload Configuration
# ==============================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#file.upload-dir=uploads/
file.upload-dir=uploads


# ==============================
# JWT Configuration
# ==============================

jwt.secret=your_super_secret_key_change_this_in_production_123456789
jwt.expiration=86400000


# ==============================
# Logging
# ==============================

logging.level.org.springframework.security=DEBUG


# Disable Open Session in View
spring.jpa.open-in-view=false